unbind C-b
set-option -g default-shell /bin/zsh
set-option -g prefix C-a
bind-key C-a send-prefix
bind-key -n C-s last-pane

bind r source-file ~/.tmux.conf
# cycle next pane
bind f select-pane -t :.+
bind-key -n M-z resize-pane -Z

set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on

# Start pane index at 1
set -g base-index 1
setw -g pane-base-index 1

set -g status-bg colour4

# Possible fix to esc delay in neovim
set -sg escape-time 1

# Highlight active pane with brighter foreground font
set -g window-style 'fg=colour250'
set -g window-active-style 'fg=colour255'
set-option -g pane-active-border-style bg=blue

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_mapping_left "M-h"
set -g @vim_navigator_mapping_right "M-l"
set -g @vim_navigator_mapping_up "M-k"
set -g @vim_navigator_mapping_down "M-j"

run '~/.tmux/plugins/tpm/tpm'
