unbind C-b
set-option -g default-shell /bin/zsh
set-option -g prefix C-a
bind-key C-a send-prefix
bind-key -n C-s last-pane

bind r source-file ~/.tmux.conf
# cycle next pane
bind f select-pane -t :.+
bind-key -n M-z resize-pane -Z

# required to let notifs and status updates through tmux
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# Allow nvim to notice focuses
set -g focus-events on

set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on

# Start pane index at 1
set -g base-index 1
setw -g pane-base-index 1

set -g status-bg colour4

# Possible fix to esc delay in neovim
set -sg escape-time 1

bind b set -g status

# Highlight active pane: dim inactive, bright active, colored borders
set -g window-style 'fg=colour246,bg=colour234'
set -g window-active-style 'fg=colour255,bg=colour232'
set-option -g pane-border-style 'fg=colour238'
set-option -g pane-active-border-style 'fg=colour214'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_mapping_left "M-h"
set -g @vim_navigator_mapping_right "M-l"
set -g @vim_navigator_mapping_up "M-k"
set -g @vim_navigator_mapping_down "M-j"

run '~/.tmux/plugins/tpm/tpm'
